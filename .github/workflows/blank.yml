name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build APK Automatically
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
        echo "Found project directory at: $PROJECT_DIR"
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: settings.gradle not found!"
          exit 1
        fi
        
        cd "$PROJECT_DIR"
        
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug || ./gradlew assembleDebug
        else
          sudo apt-get update && sudo apt-get install -y gradle
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
