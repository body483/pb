name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Full Porn Blocker App
      run: |
        echo "Setting up full project structure..."
        rm -rf app
        mkdir -p app/src/main/java/com/body483/pornblocker
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        # إنشاء خدمة الحظر والإشراف (AccessibilityService)
        cat << 'EOF' > app/src/main/java/com/body483/pornblocker/BlockerService.kt
        package com.body483.pornblocker

        import android.accessibilityservice.AccessibilityService
        import android.view.accessibility.AccessibilityEvent
        import android.widget.Toast

        class BlockerService : AccessibilityService() {
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                // محرك الرصد والحظر الفعلي
                if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                    val packageName = event.packageName?.toString() ?: ""
                    // هنا يتم فحص المحتوى أو التطبيقات المستهدفة وحظرها عند المطابقة
                }
            }

            override fun onInterrupt() {}

            override fun onServiceConnected() {
                super.onServiceConnected()
                Toast.makeText(this, "تم تفعيل خدمة الحظر بنجاح", Toast.LENGTH_SHORT).show()
            }
        }
        EOF

        # إنشاء واجهة التحكم وتفعيل وضع التجربة
        cat << 'EOF' > app/src/main/java/com/body483/pornblocker/MainActivity.kt
        package com.body483.pornblocker

        import android.app.Activity
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.TextView
        import android.widget.Toast

        class MainActivity : Activity() {
            private var isTestModeActive = false

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 80, 50, 50)
                }

                val title = TextView(this).apply {
                    text = "Porn Blocker - لوحة التحكم"
                    textSize = 22f
                    setPadding(0, 0, 0, 30)
                }
                layout.addView(title)

                val statusText = TextView(this).apply {
                    text = "حالة الحظر: متوقف (غير مفعل)"
                    textSize = 16f
                    setPadding(0, 0, 0, 30)
                }
                layout.addView(statusText)

                val btnToggleTest = Button(this).apply {
                    text = "بدء التجربة الفعّالة"
                    setOnClickListener {
                        isTestModeActive = !isTestModeActive
                        if (isTestModeActive) {
                            text = "إيقاف التجربة"
                            statusText.text = "حالة الحظر: قيد التجربة الفعّالة ✅"
                            Toast.makeText(this@MainActivity, "تم تفعيل وضع التجربة، يمكنك اختباره الآن.", Toast.LENGTH_SHORT).show()
                        } else {
                            text = "بدء التجربة الفعّالة"
                            statusText.text = "حالة الحظر: متوقف (غير مفعل)"
                            Toast.makeText(this@MainActivity, "تم إيقاف وضع التجربة بنجاح.", Toast.LENGTH_SHORT).show()
                        }
                    }
                }
                layout.addView(btnToggleTest)

                val btnSettings = Button(this).apply {
                    text = "إعدادات الأمان (Accessibility)"
                    setOnClickListener {
                        try {
                            val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                            startActivity(intent)
                        } catch (e: Exception) {
                            Toast.makeText(this@MainActivity, "تعذر فتح الإعدادات تلقائياً", Toast.LENGTH_SHORT).show()
                        }
                    }
                }
                layout.addView(btnSettings)

                val btnUninstall = Button(this).apply {
                    text = "إلغاء تثبيت التطبيق (عند التعارض)"
                    setOnClickListener {
                        val intent = Intent(Intent.ACTION_DELETE).apply {
                            data = Uri.parse("package:$packageName")
                        }
                        startActivity(intent)
                    }
                }
                layout.addView(btnUninstall)

                setContentView(layout)
            }
        }
        EOF

        # إعداد ملف إعدادات خدمة إمكانية الوصول
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="true"
            android:notificationTimeout="100" />
        EOF

        # إنشاء AndroidManifest متكامل يضم النشاط والخدمة والصلاحيات
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="Porn Blocker">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".BlockerService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="false">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        EOF

        # إعدادات gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.checkAarMetadata=false
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # إعدادات settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PornBlocker"
        include ':app'
        EOF

        # إعدادات build.gradle الرئيسي
        cat << 'EOF' > build.gradle
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # إعدادات app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.body483.pornblocker'
            compileSdk 34
            defaultConfig {
                applicationId "com.body483.pornblocker"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            lint {
                abortOnError false
                checkReleaseBuilds false
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
        }
        EOF

        # strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Porn Blocker</string>
        </resources>
        EOF

        echo "Downloading Gradle 8.5..."
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH

        echo "Building Full APK..."
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
